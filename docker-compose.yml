services:
  opencode:
    build:
      context: .
      dockerfile: docker-configs/Dockerfile
    
    container_name: opencode_workspace_vhss
    image: opencode-sandbox:latest
    
    # ========== VOLUME DO PROJETO (Isolamento) ==========
    volumes:
      # Montar APENAS o diretório do projeto específico
      - ./projects/meu_projeto_ds:/workspace:rw
      
      # Persistir configurações do OpenCode
      - opencode_data:/home/data_scientist/.opencode
      
      # Persistir cache do UV
      - uv_cache:/home/data_scientist/.cache/uv
    
    # Working directory dentro do projeto
    working_dir: /workspace
    
    # ========== VARIÁVEIS DE AMBIENTE ==========
    env_file: .env
    
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - HOME=/home/data_scientist
      - UV_CACHE_DIR=/home/data_scientist/.cache/uv
    
    # ========== PORTAS EXPOSTAS ==========
    ports:
      - "4096:4096"   # Web UI
      - "1455:1455"   # OAuth callback OpenAI
      - "8888:8888"   # Jupyter (opcional)
    
    # ========== NETWORK (Internet habilitada) ==========
    networks:
      - opencode_network
    
    # ========== RESOURCE LIMITS ==========
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    
    # ========== SEGURANÇA ==========
    security_opt:
      - no-new-privileges:true
    # Adicionar AppArmor profile (se Linux)
      # - apparmor=docker-opencode
    
    cap_drop:
      - ALL
    
    cap_add:
      - NET_BIND_SERVICE
      # - CHOWN
      # - SETUID
      # - SETGID
    
    # ========== FILESYSTEM ==========
    # NÃO usar read_only (OpenCode Web precisa escrever)
    read_only: false
    
    # Tmpfs para cache temporário
    tmpfs:
      - /tmp:size=2G
    
    # ========== RUNTIME ==========
    stdin_open: true
    tty: true
    restart: unless-stopped
    
    # ========== LOGGING ==========
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ========== VOLUMES PERSISTENTES ==========
volumes:
  opencode_data:
    driver: local
  uv_cache:
    driver: local

# ========== NETWORK ==========
networks:
  opencode_network:
    driver: bridge
