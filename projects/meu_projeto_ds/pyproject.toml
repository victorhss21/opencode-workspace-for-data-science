[project]
name = "meu-projeto-ds"
version = "0.1.0"
description = "Projeto de Ciência de Dados com OpenCode"
requires-python = ">=3.11"

dependencies = [
    # Core Data Science
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    
    # Visualization
    "matplotlib>=3.7.0",
    "seaborn>=0.13.0",
    "plotly>=5.17.0",
    
    # Machine Learning
    "xgboost>=2.0.0",
    "lightgbm>=4.1.0",
    
    # Time Series
    "statsmodels>=0.14.0",
    "prophet>=1.1.0",
    
    # LLMs
    "openai>=1.0.0",
    "anthropic>=0.7.0",
    "langchain>=0.1.0",
    
    # Utilities
    "mlflow>=3.10.1",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "jupyter>=1.0.0",
    "ipython>=8.17.0",
    "pytest>=7.4.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
]
